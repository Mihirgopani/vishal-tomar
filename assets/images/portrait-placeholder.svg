<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B1929"/>
      <stop offset="60%" stop-color="#35111D"/>
      <stop offset="100%" stop-color="#240B13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77E"/>
      <stop offset="50%" stop-color="#C5A15B"/>
      <stop offset="100%" stop-color="#A8833E"/>
    </linearGradient>
    <linearGradient id="softSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#702D43" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4B1929" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="780" fill="url(#bgGrad)"/>

  <!-- Architectural Subtle Grid -->
  <line x1="40" y1="0" x2="40" y2="780" stroke="#C5A15B" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="560" y1="0" x2="560" y2="780" stroke="#C5A15B" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="0" y1="40" x2="600" y2="40" stroke="#C5A15B" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="0" y1="740" x2="600" y2="740" stroke="#C5A15B" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Double Inner Gold Border -->
  <rect x="30" y="30" width="540" height="720" stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.8"/>
  <rect x="38" y="38" width="524" height="704" stroke="url(#gold)" stroke-width="0.5" stroke-dasharray="3 3" fill="none" opacity="0.4"/>

  <!-- Corner Flourishes -->
  <polygon points="30,30 45,30 30,45" fill="url(#gold)"/>
  <polygon points="570,30 555,30 570,45" fill="url(#gold)"/>
  <polygon points="30,750 45,750 30,735" fill="url(#gold)"/>
  <polygon points="570,750 555,750 570,735" fill="url(#gold)"/>

  <!-- Large Watermark Monogram in Center -->
  <g opacity="0.08" transform="translate(150, 190) scale(2.5)">
    <rect x="6" y="6" width="108" height="108" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M 32 36 L 88 36 M 60 36 L 60 84 M 28 42 L 60 92 L 92 42" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  </g>

  <!-- Dignified Executive Silhouette -->
  <g transform="translate(175, 160)" fill="url(#softSilhouette)" stroke="url(#gold)" stroke-width="0.75" stroke-opacity="0.5">
    <!-- Head -->
    <ellipse cx="125" cy="110" rx="46" ry="58"/>
    <!-- Neck & Collar / Robes -->
    <path d="M 100 162 L 92 205 L 158 205 L 150 162 Z"/>
    <!-- Advocate Bands (White Collar Bands) Placeholder -->
    <rect x="114" y="200" width="10" height="42" fill="#F7F2ED" opacity="0.85"/>
    <rect x="126" y="200" width="10" height="42" fill="#F7F2ED" opacity="0.85"/>
    <!-- Shoulders & Coat -->
    <path d="M 92 205 C 50 215 10 245 0 350 L 250 350 C 240 245 200 215 158 205 Z"/>
  </g>

  <!-- Typography Card Overlay at Bottom -->
  <rect x="60" y="560" width="480" height="150" fill="#240B13" fill-opacity="0.9" stroke="url(#gold)" stroke-width="0.75" rx="2"/>
  
  <text x="300" y="598" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#F7F2ED" text-anchor="middle" letter-spacing="3">VISHAL TOMAR</text>
  <line x1="220" y1="612" x2="380" y2="612" stroke="url(#gold)" stroke-width="1"/>
  <text x="300" y="632" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#C5A15B" text-anchor="middle" letter-spacing="2.5">ADVOCATE · GUJARAT HIGH COURT</text>
  <text x="300" y="660" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="400" fill="#B9828F" text-anchor="middle" letter-spacing="1.5">CLIENT PORTRAIT PLACEHOLDER</text>
  <text x="300" y="682" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="400" fill="#8C848C" text-anchor="middle" letter-spacing="1">To be replaced with verified executive photography</text>
</svg>
