<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77E"/>
      <stop offset="50%" stop-color="#C5A15B"/>
      <stop offset="100%" stop-color="#9E7A38"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A1F32"/>
      <stop offset="100%" stop-color="#300E1B"/>
    </linearGradient>
  </defs>
  <!-- Architectural Outer Octagon / Diamond Framing -->
  <rect x="6" y="6" width="108" height="108" rx="2" stroke="url(#goldGrad)" stroke-width="1.5" fill="url(#wineGrad)"/>
  <rect x="12" y="12" width="96" height="96" rx="1" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.6"/>
  
  <!-- Interlocking Serif Monogram: V & T -->
  <!-- Top Bar of T -->
  <path d="M 32 36 L 88 36 M 34 33 L 34 39 M 86 33 L 86 39" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="square"/>
  
  <!-- Central Stem of T -->
  <line x1="60" y1="36" x2="60" y2="84" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <line x1="53" y1="84" x2="67" y2="84" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Architectural V crossing behind / through T -->
  <path d="M 28 42 L 60 92 L 92 42" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <line x1="24" y1="42" x2="32" y2="42" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="88" y1="42" x2="96" y2="42" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Center Diamond Accent -->
  <polygon points="60,22 64,26 60,30 56,26" fill="url(#goldGrad)"/>
</svg>
